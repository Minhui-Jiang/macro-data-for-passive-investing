[project]
name = "finance"
version = "0.1.0"
description = "Scrape financial indicators and append a dated snapshot to monthly_observations.csv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "filelock>=3.32.6",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
]

[dependency-groups]
dev = [
    "numbers-parser>=4.19.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
